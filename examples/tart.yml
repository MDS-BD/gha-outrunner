# Shared two-slot macOS pool on one Apple Silicon host.
# Use prepared, powered-off base VMs; Tart creates a disposable clone per job.
# Existing 1+1 setup: omit groups and set each runner's max_runners to 1.
url: https://github.com/your-org/your-repo
# token_file: /etc/outrunner/token

groups:
  macos:
    max_runners: 2

runners:
  macos-26:
    labels: [self-hosted, macos-26, arm64]
    group: macos
    max_runners: 2
    tart:
      image: ci-macos-26-base
      runner_cmd: /Users/runner/actions-runner/run.sh
      cpus: 4
      memory: 8192

  macos-27:
    labels: [self-hosted, macos-27, arm64]
    group: macos
    max_runners: 2
    tart:
      image: ci-macos-27-base
      runner_cmd: /Users/runner/actions-runner/run.sh
      cpus: 4
      memory: 8192
